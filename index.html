<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutschkurs-Plan</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script></head><body>
<div id="login" class="box" hidden>
  <h1>Deutschkurs-Plan</h1>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password">
  <button class="btn" id="go">Anmelden</button><div class="err" id="err"></div>
</div>
<div id="app" hidden>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h1 style="margin:0">Deutschkurs-Plan</h1><select id="plan" class="noprint"></select><span id="ptitle" class="onlyprint"></span>
    <button class="btn ghost noprint" id="out" style="margin-left:auto">Abmelden</button>
  </div>
  <div class="bar noprint">
    <div class="chips" id="chips"></div>
    <div class="opts">
      <label><input type="checkbox" id="hide"> Andere ausblenden</label>
      <label><input type="checkbox" id="vonly"> Nur Vertretungen</label>
      <label><input type="checkbox" id="list"> Einsatzliste unten anzeigen</label>
      <button class="btn" id="ics" disabled>In Kalender übernehmen (.ics)</button>
      <button class="btn ghost" id="pdf">Als PDF speichern / drucken</button>
      <button class="btn ghost" id="xls">Als Excel herunterladen</button>
    </div>
  </div>
  <div id="cal"></div><div id="sum"></div>
  <p style="color:var(--mut);font-size:12px">Gelb = Vertretung · Grau = Feiertag</p>
</div>
<script src="lib.js"></script>
<script>
const WD = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const TEIL = { ganztag: "", vormittag: "vormittags", nachmittag: "nachmittags" };
let E = [], N = {}, KURSE = [], sel = null, planName = "";
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const label = s => `${s.slice(8)}.${s.slice(5,7)}.`;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("app").hidden = !session;
  if (!session) return;
  const { data: plans, error } = await sb.from("plans").select("*").order("created_at", { ascending: false });
  if (error) { alert(error.message); return; }
  $("plan").innerHTML = plans.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  if (plans.length) loadPlan(plans[0].id); else $("cal").textContent = "Noch kein Plan vorhanden.";
}
async function loadPlan(id) {
  planName = $("plan").selectedOptions[0].textContent;
  const [e, n] = await Promise.all([
    sb.from("entries").select("*").eq("plan_id", id).range(0, 4999),
    sb.from("day_notes").select("*").eq("plan_id", id)]);
  E = e.data || []; N = Object.fromEntries((n.data || []).map(x => [x.datum, x.notiz]));
  KURSE = [...new Set(E.map(x => x.kurs))].sort();
  const names = [...new Set(E.map(x => x.name))].sort((a, b) => a.localeCompare(b, "de"));
  const saved = localStorage.getItem("dk_name"); sel = names.includes(saved) ? saved : null;
  $("chips").innerHTML = "";
  names.forEach(n => { const b = document.createElement("button"); b.className = "chip"; b.textContent = n;
    b.onclick = () => { sel = sel === n ? null : n; sel ? localStorage.setItem("dk_name", sel) : localStorage.removeItem("dk_name"); apply(); };
    $("chips").append(b); });
  render(); apply();
}
function render() {
  const dates = [...E.map(x => x.datum), ...Object.keys(N)].sort();
  $("cal").innerHTML = ""; if (!dates.length) return;
  const by = {}; E.forEach(x => ((by[x.datum] ??= {})[x.teil] ??= {})[x.kurs] = x);
  const GP = [1, 1, 1, 1, 1];
  Object.keys(by).forEach(d => { const t = new Set(Object.keys(by[d]).map(x => x === "ganztag" ? "vormittag" : x)); if (t.size > 1) GP[(parse(d).getDay() + 6) % 7] = 2; });
  let m = parse(dates[0]); m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  const last = parse(dates.at(-1));
  for (; m <= last; m.setDate(m.getDate() + 7)) {
    const days = [...Array(5)].map((_, i) => { const d = new Date(m); d.setDate(d.getDate() + i); return iso(d); });
    const P = days.map(d => { const t = Object.keys(by[d] || {}).map(x => x === "ganztag" ? "vormittag" : x);
      return t.includes("vormittag") && t.includes("nachmittag") ? ["vormittag", "nachmittag"] : [t[0] || "vormittag"]; });
    const LB = { vormittag: "Vormittag", nachmittag: "Nachmittag" };
    let h = "<tr><th></th>", h2 = "<tr><th></th>";
    days.forEach((d, i) => { h += `<th colspan="${GP[i]}">${WD[i]}<small>${label(d)}</small></th>`;
      h2 += by[d] ? P[i].map(p => `<th colspan="${P[i].length < GP[i] ? GP[i] : 1}"><small>${LB[p]}</small></th>`).join("") : `<th colspan="${GP[i]}"></th>`; });
    h2 += "</tr>";
    const t = document.createElement("table"); t.innerHTML = h + "</tr>" + h2;
    KURSE.forEach((k, ki) => {
      const tr = document.createElement("tr"); tr.innerHTML = `<td class="k">${k}</td>`;
      days.forEach((d, i) => {
        const parts = P[i];
        if (N[d]) { if (!ki) { const td = document.createElement("td"); td.className = "note"; td.rowSpan = KURSE.length; td.colSpan = GP[i]; td.textContent = N[d]; tr.append(td); } return; }
        parts.forEach((p, pi) => { const x = by[d]?.[p]?.[k] || (p === "vormittag" ? by[d]?.ganztag?.[k] : null); const td = document.createElement("td");
          td.className = "n " + (x?.vertretung ? "vt" : "reg") + (pi ? " pm" : ""); if (parts.length < GP[i]) td.colSpan = GP[i]; td.dataset.name = x?.name || "";
          if (x) { td.textContent = x.name; if (x.hinweis) { const hn = document.createElement("small"); hn.className = "hn"; hn.textContent = "(" + x.hinweis + ")"; td.append(hn); } if (x.vertretung) td.insertAdjacentHTML("beforeend", '<span class="v">V</span>'); }
          tr.append(td); });
      });
      t.append(tr);
    });
    const w = document.createElement("div"); w.className = "wrap"; w.append(t); $("cal").append(w);
  }
}
function items() {
  let it = E.filter(x => x.name === sel).sort((a, b) => a.datum.localeCompare(b.datum) || a.teil.localeCompare(b.teil));
  return $("vonly").checked ? it.filter(x => x.vertretung) : it;
}
function apply() {
  $("ptitle").textContent = planName + (sel ? " · " + sel : "");
  document.body.classList.toggle("f", !!sel);
  document.body.classList.toggle("hide", $("hide").checked);
  document.body.classList.toggle("vonly", $("vonly").checked);
  [...$("chips").children].forEach(b => b.setAttribute("aria-pressed", b.textContent === sel));
  document.querySelectorAll("td.n").forEach(td => td.classList.toggle("hit", !!sel && td.dataset.name === sel));
  $("ics").disabled = !sel;
  const s = $("sum");
  if (!sel || !$("list").checked) { s.style.display = "none"; return; }
  const it = items(), nv = it.filter(x => x.vertretung).length;
  s.style.display = "block";
  s.innerHTML = `<b>${sel}</b>: ${it.length} Einsätze${$("vonly").checked ? "" : `, davon ${nv} Vertretung${nv == 1 ? "" : "en"}`}<ul>` +
    it.map(x => `<li>${WD[(parse(x.datum).getDay() + 6) % 7].slice(0, 2)} ${label(x.datum)} ${TEIL[x.teil]} · Kurs ${x.kurs}${x.vertretung ? " · <b>Vertretung</b>" : ""}${x.hinweis ? " · " + x.hinweis : ""}</li>`).join("") + "</ul>";
}
function downloadICS() {
  const esc = s => s.replace(/[\\;,]/g, "\\$&"), stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Deutschkurs-Plan//DE", "CALSCALE:GREGORIAN"];
  items().forEach(x => {
    const d = x.datum.replace(/-/g, ""), t = CONFIG.TIMES[x.teil];
    L.push("BEGIN:VEVENT", `UID:${d}-${x.teil}-${x.kurs}-${x.name.replace(/\W/g, "")}@deutschkurs-plan`, `DTSTAMP:${stamp}`);
    if (t) L.push(`DTSTART:${d}T${t[0].replace(":", "")}00`, `DTEND:${d}T${t[1].replace(":", "")}00`);
    else { const n = parse(x.datum); n.setDate(n.getDate() + 1); L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${iso(n).replace(/-/g, "")}`); }
    L.push(`SUMMARY:${esc(`${CONFIG.TITLE} ${x.kurs}${x.vertretung ? " (Vertretung)" : ""}`)}`,
      `DESCRIPTION:${esc(`${planName} · ${x.name}${x.hinweis ? " · " + x.hinweis : ""}`)}`, "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar" }));
  a.download = `Deutschkurs_${sel}.ics`; a.click();
}

function model() {
  const dates = [...E.map(x => x.datum), ...Object.keys(N)].sort(), by = {}, weeks = [], GP = [1, 1, 1, 1, 1];
  E.forEach(x => ((by[x.datum] ??= {})[x.teil] ??= {})[x.kurs] = x);
  Object.keys(by).forEach(d => { const t = new Set(Object.keys(by[d]).map(x => x === "ganztag" ? "vormittag" : x)); if (t.size > 1) GP[(parse(d).getDay() + 6) % 7] = 2; });
  if (dates.length) { const m = parse(dates[0]); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); const last = parse(dates.at(-1));
    for (; m <= last; m.setDate(m.getDate() + 7)) weeks.push([...Array(5)].map((_, i) => { const d = new Date(m); d.setDate(d.getDate() + i); return iso(d); })); }
  return { by, GP, weeks };
}
async function downloadXLSX() {
  const { by, GP, weeks } = model(), dim = sel && $("hide").checked;
  const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet("Plan");
  ws.getColumn(1).width = 10; for (let c = 2; c <= GP.reduce((a, b) => a + b, 0) + 1; c++) ws.getColumn(c).width = 18;
  const fill = rgb => ({ type: "pattern", pattern: "solid", fgColor: { argb: "FF" + rgb } });
  const bd = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
  const st = (cell, o = {}) => { cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; cell.border = bd;
    if (o.fill) cell.fill = fill(o.fill); cell.font = { name: "Arial", size: 10, bold: !!o.bold, color: { argb: "FF" + (o.color || "000000") } }; };
  ws.getCell(1, 1).value = planName + (sel ? " – " + sel : ""); ws.getCell(1, 1).font = { name: "Arial", size: 14, bold: true };
  let r = 3;
  weeks.forEach(days => {
    const merges = [], start = []; let c = 2; days.forEach((d, i) => { start.push(c); c += GP[i]; });
    ws.getRow(r).height = 32;
    st(ws.getCell(r, 1), { fill: "E8EEFB" }); st(ws.getCell(r + 1, 1), { fill: "E8EEFB" });
    KURSE.forEach((k, ki) => { const cell = ws.getCell(r + 2 + ki, 1); cell.value = k; st(cell, { fill: "E8EEFB", bold: true }); });
    days.forEach((d, i) => {
      const c0 = start[i], span = GP[i], t = new Set(Object.keys(by[d] || {}).map(x => x === "ganztag" ? "vormittag" : x));
      const parts = t.has("vormittag") && t.has("nachmittag") ? ["vormittag", "nachmittag"] : [[...t][0] || "vormittag"];
      for (let k = 0; k < span; k++) { st(ws.getCell(r, c0 + k), { fill: "E8EEFB", bold: true }); st(ws.getCell(r + 1, c0 + k), { fill: "E8EEFB", color: "555555" }); }
      ws.getCell(r, c0).value = `${WD[i]}\n${label(d)}`; if (span > 1) merges.push([r, c0, r, c0 + span - 1]);
      if (by[d]) { parts.forEach((p, pi) => ws.getCell(r + 1, c0 + pi).value = p === "nachmittag" ? "Nachmittag" : "Vormittag"); if (parts.length < span) merges.push([r + 1, c0, r + 1, c0 + span - 1]); }
      KURSE.forEach((k, ki) => {
        const row = r + 2 + ki;
        if (N[d]) { for (let q = 0; q < span; q++) st(ws.getCell(row, c0 + q), { fill: "D4D4D8", bold: true });
          if (!ki) { ws.getCell(row, c0).value = N[d]; merges.push([row, c0, row + KURSE.length - 1, c0 + span - 1]); } return; }
        parts.forEach((p, pi) => {
          const x = by[d]?.[p]?.[k] || (p === "vormittag" ? by[d]?.ganztag?.[k] : null), mine = x && x.name === sel, hid = x && dim && !mine;
          const o = !x || hid ? {} : mine ? { fill: "2563EB", color: "FFFFFF", bold: true } : x.vertretung ? { fill: "FFF3A8" } : {};
          const wide = parts.length < span, last = wide ? span - 1 : 0;
          for (let q = pi; q <= pi + last; q++) st(ws.getCell(row, c0 + q), o);
          if (x && !hid) ws.getCell(row, c0 + pi).value = x.name + (x.hinweis ? ` (${x.hinweis})` : "") + (x.vertretung ? " (V)" : "");
          if (wide && by[d]) merges.push([row, c0, row, c0 + span - 1]);
        });
      });
    });
    merges.forEach(m => ws.mergeCells(...m));
    r += KURSE.length + 3;
  });
  ws.pageSetup = { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = `Deutschkurs_${(sel || planName).replace(/[^\wäöüÄÖÜß-]+/g, "_")}.xlsx`; a.click();
}
$("go").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: CONFIG.READER_EMAIL, password: $("pw").value });
  if (error) $("err").textContent = "Passwort falsch."; else { $("err").textContent = ""; start(); }
};
$("pw").onkeydown = e => { if (e.key == "Enter") $("go").click(); };
$("out").onclick = async () => { await sb.auth.signOut(); start(); };
$("plan").onchange = () => loadPlan($("plan").value);
["hide", "vonly", "list"].forEach(i => $(i).onchange = apply);
$("ics").onclick = downloadICS;
$("pdf").onclick = () => window.print();
$("xls").onclick = downloadXLSX;
start();
</script></body></html>
