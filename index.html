<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutschkurs-Plan</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script></head><body>
<div id="login" class="box" hidden>
  <h1>Deutschkurs-Plan</h1>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password">
  <button class="btn" id="go">Anmelden</button><div class="err" id="err"></div>
</div>
<div id="app" hidden>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h1 style="margin:0">Deutschkurs-Plan</h1><select id="plan" class="noprint"></select><span id="ptitle" class="onlyprint"></span>
    <button class="btn ghost noprint" id="out" style="margin-left:auto">Abmelden</button>
  </div>
  <div class="bar noprint">
    <div class="chips" id="chips"></div>
    <div class="opts">
      <label><input type="checkbox" id="hide"> Andere ausblenden</label>
      <label><input type="checkbox" id="vonly"> Nur Vertretungen</label>
      <label><input type="checkbox" id="list"> Einsatzliste unten anzeigen</label>
      <button class="btn" id="ics" disabled>In Kalender übernehmen (.ics)</button>
      <button class="btn ghost" id="pdf">Als PDF speichern / drucken</button>
      <button class="btn ghost" id="xls">Als Excel herunterladen</button>
    </div>
    <div class="opts" id="cbox" hidden>
      <button class="btn" id="conf"></button><span id="cst"></span>
    </div>
  </div>
  <div id="cal"></div><div id="sum"></div>
  <p style="color:var(--mut);font-size:12px">Gelb = Vertretung · Grau = Feiertag<br><span class="ja" style="font-size:11px;margin:0">黄 = 代講 · 灰 = 祝日</span></p>
</div>
<dialog id="dlg">
  <div style="display:grid;gap:10px;width:min(440px,84vw)">
    <b id="dtitle" style="font-size:17px"></b>
    <div>Bist du sicher? Passen alle Daten und Tage?<br><span class="ja" style="margin:0">本当によろしいですか？日程・曜日はすべて合っていますか？</span></div>
    <label class="rad"><input type="radio" name="st" value="ok" checked> <span>Alles OK <span class="ja">問題なし</span></span></label>
    <label class="rad"><input type="radio" name="st" value="problem"> <span>Nicht OK – etwas stimmt nicht <span class="ja">問題あり</span></span></label>
    <div id="cm" hidden><textarea id="ctext" rows="3" placeholder="Was stimmt nicht? Bitte Tag und Kurs nennen. / どの日・クラスが違いますか？"></textarea></div>
    <div class="err" id="derr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="dcancel">Abbrechen</button><button class="btn" id="dok">OK</button></div>
  </div>
</dialog>
<script src="lib.js"></script>
<script>
const WD = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const JA = ["月曜日","火曜日","水曜日","木曜日","金曜日"], LBJ = { vormittag: "午前", nachmittag: "午後" };
const jaNote = t => /^Feiertag/.test(t) ? "祝日" : /^Abschlussfeier/.test(t) ? t.replace("Abschlussfeier", "修了式").replace(/\s*Uhr/, "") : "";
const jaHint = t => { const m = t.match(/^ab (\d{1,2})(?::(\d{2}))? Uhr$/); return m ? `${m[1]}時${m[2] ? m[2] + "分" : ""}から` : ""; };
const jaSpan = t => { const s = document.createElement("span"); s.className = "ja"; s.textContent = t; return s; };
const TEIL = { ganztag: "", vormittag: "vormittags", nachmittag: "nachmittags" };
let E = [], N = {}, KURSE = [], sel = null, planName = "", planId = null, CONF = {};
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const label = s => `${s.slice(8)}.${s.slice(5,7)}.`;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("app").hidden = !session;
  if (!session) return;
  const { data: plans, error } = await sb.from("plans").select("*").order("created_at", { ascending: false });
  if (error) { alert(error.message); return; }
  $("plan").innerHTML = plans.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  if (plans.length) loadPlan(plans[0].id); else $("cal").textContent = "Noch kein Plan vorhanden.";
}
async function loadPlan(id) {
  planName = $("plan").selectedOptions[0].textContent;
  const [e, n, cf] = await Promise.all([
    sb.from("entries").select("*").eq("plan_id", id).range(0, 4999),
    sb.from("day_notes").select("*").eq("plan_id", id),
    sb.from("confirmations").select("*").eq("plan_id", id)]);
  planId = id; CONF = Object.fromEntries((cf.data || []).map(x => [x.name, { at: x.confirmed_at, status: x.status || "ok", kommentar: x.kommentar || "" }])); E = e.data || []; N = Object.fromEntries((n.data || []).map(x => [x.datum, x.notiz]));
  KURSE = [...new Set(E.map(x => x.kurs))].sort();
  const names = [...new Set(E.map(x => x.name))].sort((a, b) => a.localeCompare(b, "de"));
  const saved = localStorage.getItem("dk_name"); sel = names.includes(saved) ? saved : null;
  $("chips").innerHTML = "";
  names.forEach(n => { const b = document.createElement("button"); b.className = "chip"; b.dataset.n = n; b.textContent = n;
    b.onclick = () => { sel = sel === n ? null : n; sel ? localStorage.setItem("dk_name", sel) : localStorage.removeItem("dk_name"); apply(); };
    $("chips").append(b); });
  render(); apply();
}
const LB = { vormittag: "Vormittag", nachmittag: "Nachmittag" };
function model() {
  const dates = [...E.map(x => x.datum), ...Object.keys(N)].sort(), by = {}, weeks = [];
  E.forEach(x => ((by[x.datum] ??= {})[x.teil] ??= {})[x.kurs] = x);
  if (dates.length) { const m = parse(dates[0]); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); const last = parse(dates.at(-1));
    for (; m <= last; m.setDate(m.getDate() + 7)) weeks.push([...Array(5)].map((_, i) => { const d = new Date(m); d.setDate(d.getDate() + i); return iso(d); })); }
  return { by, weeks };
}
const getX = (by, d, p, k) => by[d]?.[p]?.[k] || (p === "vormittag" ? by[d]?.ganztag?.[k] : null);
function render() {
  const { by, weeks } = model();
  $("cal").innerHTML = "";
  weeks.forEach(days => {
    const bands = ["vormittag"]; if (days.some(d => by[d]?.nachmittag)) bands.push("nachmittag");
    const nr = bands.length * KURSE.length, t = document.createElement("table");
    t.innerHTML = '<colgroup><col style="width:88px"><col style="width:56px"></colgroup><tr><th colspan="2"></th>' +
      days.map((d, i) => `<th>${WD[i]}<span class="ja">${JA[i]}</span><small>${label(d)}</small></th>`).join("") + "</tr>";
    bands.forEach((p, bi) => KURSE.forEach((k, ki) => {
      const tr = document.createElement("tr"); if (bi && !ki) tr.className = "bandstart";
      if (!ki) tr.innerHTML = `<td class="pt" rowspan="${KURSE.length}">${LB[p]}<br><span class="ja">${LBJ[p]}</span></td>`;
      tr.insertAdjacentHTML("beforeend", `<td class="k">${k}</td>`);
      days.forEach(d => {
        if (N[d]) { if (!bi && !ki) { const td = document.createElement("td"); td.className = "note"; td.rowSpan = nr; td.append(N[d]); const jn = jaNote(N[d]); if (jn) td.append(document.createElement("br"), jaSpan(jn)); tr.append(td); } return; }
        const x = getX(by, d, p, k), td = document.createElement("td");
        if (!x) { td.className = bi ? "nu" : ""; tr.append(td); return; }
        td.className = "n " + (x.vertretung ? "vt" : "reg"); td.dataset.name = x.name; td.textContent = x.name;
        if (x.hinweis) { const hn = document.createElement("small"); hn.className = "hn"; hn.textContent = "(" + x.hinweis + (jaHint(x.hinweis) ? " / " + jaHint(x.hinweis) : "") + ")"; td.append(hn); }
        if (x.vertretung) td.insertAdjacentHTML("beforeend", '<span class="v">V<span class="ja">代講</span></span>');
        tr.append(td);
      });
      t.append(tr);
    }));
    const w = document.createElement("div"); w.className = "wrap"; w.append(t); $("cal").append(w);
  });
}
function items() {
  let it = E.filter(x => x.name === sel).sort((a, b) => a.datum.localeCompare(b.datum) || a.teil.localeCompare(b.teil));
  return $("vonly").checked ? it.filter(x => x.vertretung) : it;
}
function apply() {
  $("ptitle").textContent = planName + (sel ? " · " + sel : "");
  document.body.classList.toggle("f", !!sel);
  document.body.classList.toggle("hide", $("hide").checked);
  document.body.classList.toggle("vonly", $("vonly").checked);
  document.body.classList.toggle("cok", !!sel && CONF[sel]?.status === "ok");
  document.body.classList.toggle("cpb", !!sel && CONF[sel]?.status === "problem");
  [...$("chips").children].forEach(b => { const c = CONF[b.dataset.n];
    b.textContent = b.dataset.n + (c ? (c.status === "problem" ? " ⚠" : " ✓") : "");
    b.classList.toggle("ok", !!c && c.status !== "problem"); b.classList.toggle("pb", !!c && c.status === "problem");
    b.setAttribute("aria-pressed", b.dataset.n === sel); });
  document.querySelectorAll("td.n").forEach(td => td.classList.toggle("hit", !!sel && td.dataset.name === sel));
  $("ics").disabled = !sel; $("cbox").hidden = !sel;
  if (sel) { const c = CONF[sel], dt = c ? new Date(c.at).toLocaleDateString("de-DE") : "";
    $("cst").textContent = !c ? "Noch nicht bestätigt · 未確認" : c.status === "problem" ? `⚠ Problem gemeldet am ${dt}: ${c.kommentar} · 問題あり` : `✓ Bestätigt am ${dt} · 確認済み`;
    $("conf").textContent = c ? "Antwort ändern 回答を変更" : "Bestätigen / Rückmeldung 確認"; }
  const s = $("sum");
  if (!sel || !$("list").checked) { s.style.display = "none"; return; }
  const it = items(), nv = it.filter(x => x.vertretung).length;
  s.style.display = "block";
  s.innerHTML = `<b>${sel}</b>: ${it.length} Einsätze${$("vonly").checked ? "" : `, davon ${nv} Vertretung${nv == 1 ? "" : "en"}`}<ul>` +
    it.map(x => `<li>${WD[(parse(x.datum).getDay() + 6) % 7].slice(0, 2)} ${label(x.datum)} ${TEIL[x.teil]} · Kurs ${x.kurs}${x.vertretung ? " · <b>Vertretung</b> <span class=\"ja\">代講</span>" : ""}${x.hinweis ? " · " + x.hinweis : ""}</li>`).join("") + "</ul>";
}
const fold = l => l.length > 70 ? l.match(/.{1,70}/gu).join("\r\n ") : l;
function downloadICS() {
  const esc = s => s.replace(/[\\;,]/g, "\\$&"), stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Deutschkurs-Plan//DE", "CALSCALE:GREGORIAN"];
  items().forEach(x => {
    const d = x.datum.replace(/-/g, ""), t = CONFIG.TIMES[x.teil];
    L.push("BEGIN:VEVENT", `UID:${d}-${x.teil}-${x.kurs}-${x.name.replace(/\W/g, "")}@deutschkurs-plan`, `DTSTAMP:${stamp}`);
    if (t) L.push(`DTSTART:${d}T${t[0].replace(":", "")}00`, `DTEND:${d}T${t[1].replace(":", "")}00`);
    else { const n = parse(x.datum); n.setDate(n.getDate() + 1); L.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${iso(n).replace(/-/g, "")}`); }
    L.push(`SUMMARY:${esc(`${CONFIG.TITLE ?? "Gaimusho"} ${x.kurs}${x.vertretung ? " (Vertretung)" : ""}`)}`,
      `DESCRIPTION:${esc(`${planName} · ${x.name}${x.hinweis ? " · " + x.hinweis : ""}`)}`, `LOCATION:${esc(CONFIG.LOCATION ?? "4 Chome-2-1 Sagamiono, Minami Ward, Sagamihara, Kanagawa 252-0303, Japan")}`, "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L.map(fold).join("\r\n")], { type: "text/calendar" }));
  a.download = `Deutschkurs_${sel}.ics`; a.click();
}

async function downloadXLSX() {
  const { by, weeks } = model(), dim = sel && $("hide").checked, n = KURSE.length;
  const rt = (de, ja) => ({ richText: [{ text: de + "\n", font: { name: "Arial", size: 10, bold: true } }, { text: ja, font: { name: "Arial", size: 8 } }] });
  const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet("Plan");
  ws.getColumn(1).width = 13; ws.getColumn(2).width = 8; for (let c = 3; c <= 7; c++) ws.getColumn(c).width = 20;
  const fill = rgb => ({ type: "pattern", pattern: "solid", fgColor: { argb: "FF" + rgb } });
  const bd = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
  const st = (cell, o = {}) => { cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; cell.border = bd;
    if (o.fill) cell.fill = fill(o.fill); cell.font = { name: "Arial", size: 10, bold: !!o.bold, color: { argb: "FF" + (o.color || "000000") } }; };
  ws.getCell(1, 1).value = planName + (sel ? " – " + sel : ""); ws.getCell(1, 1).font = { name: "Arial", size: 14, bold: true };
  let r = 3;
  weeks.forEach(days => {
    const bands = ["vormittag"]; if (days.some(d => by[d]?.nachmittag)) bands.push("nachmittag");
    const nr = bands.length * n, merges = [];
    ws.getRow(r).height = 32; st(ws.getCell(r, 1), { fill: "E8EEFB" }); st(ws.getCell(r, 2), { fill: "E8EEFB" });
    days.forEach((d, i) => { const c = ws.getCell(r, 3 + i); c.value = rt(WD[i], JA[i] + " " + label(d)); st(c, { fill: "E8EEFB", bold: true }); });
    bands.forEach((p, bi) => {
      const r0 = r + 1 + bi * n;
      for (let q = 0; q < n; q++) st(ws.getCell(r0 + q, 1), { fill: "E8EEFB", bold: true });
      ws.getCell(r0, 1).value = rt(LB[p], LBJ[p]); if (n > 1) merges.push([r0, 1, r0 + n - 1, 1]);
      KURSE.forEach((k, ki) => {
        const row = r0 + ki; ws.getCell(row, 2).value = k; st(ws.getCell(row, 2), { fill: "E8EEFB", bold: true });
        days.forEach((d, i) => {
          const cell = ws.getCell(row, 3 + i);
          if (N[d]) { st(cell, { fill: "D4D4D8", bold: true }); if (!bi && !ki) { cell.value = jaNote(N[d]) ? rt(N[d], jaNote(N[d])) : N[d]; if (nr > 1) merges.push([row, 3 + i, row + nr - 1, 3 + i]); } return; }
          const x = getX(by, d, p, k), mine = x && x.name === sel, hid = x && dim && !mine;
          st(cell, !x ? (bi ? { fill: "F1F3F7" } : {}) : hid ? {} : mine ? { fill: "2563EB", color: "FFFFFF", bold: true } : x.vertretung ? { fill: "FFF3A8" } : {});
          if (x && !hid) cell.value = x.name + (x.hinweis ? ` (${x.hinweis}${jaHint(x.hinweis) ? " / " + jaHint(x.hinweis) : ""})` : "") + (x.vertretung ? " (V・代講)" : "");
        });
      });
    });
    merges.forEach(m => ws.mergeCells(...m));
    r += nr + 2;
  });
  ws.pageSetup = { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  const buf = await wb.xlsx.writeBuffer(), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = `Deutschkurs_${(sel || planName).replace(/[^\wäöüÄÖÜß-]+/g, "_")}.xlsx`; a.click();
}
$("go").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: CONFIG.READER_EMAIL, password: $("pw").value });
  if (error) $("err").textContent = "Passwort falsch."; else { $("err").textContent = ""; start(); }
};
$("pw").onkeydown = e => { if (e.key == "Enter") $("go").click(); };
$("out").onclick = async () => { await sb.auth.signOut(); start(); };
$("plan").onchange = () => loadPlan($("plan").value);
["hide", "vonly", "list"].forEach(i => $(i).onchange = apply);
$("ics").onclick = downloadICS;
$("pdf").onclick = () => window.print();
$("xls").onclick = downloadXLSX;
const radio = () => document.querySelector("input[name=st]:checked").value;
const syncDlg = () => { $("cm").hidden = radio() !== "problem"; };
document.querySelectorAll("input[name=st]").forEach(r => r.onchange = syncDlg);
function confirmPlan() {
  if (!sel) return;
  const c = CONF[sel] || {};
  $("dtitle").textContent = sel;
  document.querySelector(`input[name=st][value=${c.status === "problem" ? "problem" : "ok"}]`).checked = true;
  $("ctext").value = c.kommentar || ""; $("derr").textContent = ""; syncDlg();
  $("dlg").showModal();
}
$("conf").onclick = confirmPlan;
$("dcancel").onclick = () => $("dlg").close();
$("dok").onclick = async () => {
  const status = radio(), kommentar = $("ctext").value.trim();
  if (status === "problem" && !kommentar) { $("derr").textContent = "Bitte kurz beschreiben, was nicht stimmt. · 内容をご記入ください。"; return; }
  const at = new Date().toISOString(), k = status === "problem" ? kommentar : null;
  const { error } = await sb.from("confirmations").upsert({ plan_id: planId, name: sel, confirmed_at: at, status, kommentar: k }, { onConflict: "plan_id,name" });
  if (error) { $("derr").textContent = "Das hat nicht geklappt: " + error.message; return; }
  CONF[sel] = { at, status, kommentar: k || "" }; $("dlg").close(); apply();
};
start();
</script></body></html>
